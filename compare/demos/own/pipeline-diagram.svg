<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif">
  <!-- Demo image for compare-codecs: a flat diagram with thin lines and small text,
       the kind of content where codecs behave differently from photos. Rasterized
       to pipeline-diagram.png (see README.md in this folder). -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="60" y="70" font-size="30" font-weight="700" fill="#0f172a">compare-codecs: equal-quality search</text>
  <text x="60" y="102" font-size="16" fill="#475569">Each codec's quality knob is binary-searched until the decoded image reaches the target ssimulacra2 score.</text>

  <g font-size="18" text-anchor="middle">
    <rect x="60" y="170" width="190" height="90" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="155" y="210" font-weight="700" fill="#0c4a6e">Reference</text>
    <text x="155" y="236" font-size="14" fill="#0369a1">PNG, sRGB, stripped</text>

    <rect x="330" y="170" width="190" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="425" y="210" font-weight="700" fill="#4c1d95">Encode</text>
    <text x="425" y="236" font-size="14" fill="#6d28d9">cjxl · avifenc · cwebp …</text>

    <rect x="600" y="170" width="190" height="90" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="695" y="210" font-weight="700" fill="#831843">Decode</text>
    <text x="695" y="236" font-size="14" fill="#be185d">back to PNG</text>

    <rect x="870" y="170" width="270" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="1005" y="210" font-weight="700" fill="#14532d">Measure</text>
    <text x="1005" y="236" font-size="14" fill="#15803d">ssimulacra2 · dssim · bytes</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="250" y1="215" x2="326" y2="215"/>
    <line x1="520" y1="215" x2="596" y2="215"/>
    <line x1="790" y1="215" x2="866" y2="215"/>
    <path d="M1005,260 V330 H425 V264"/>
  </g>
  <rect x="560" y="312" width="320" height="36" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="720" y="336" font-size="15" text-anchor="middle" fill="#9a3412">|score − target| &gt; tolerance → adjust knob</text>

  <g font-size="15" fill="#334155">
    <text x="60" y="420" font-size="20" font-weight="700" fill="#0f172a">Knobs searched</text>
    <line x1="60" y1="434" x2="560" y2="434" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="466">JPEG XL, jpegli</text><text x="300" y="466" font-family="Menlo, monospace">-d 0.4 … 15</text>
    <text x="60" y="496">AVIF</text><text x="300" y="496" font-family="Menlo, monospace">--min/--max 0 … 63</text>
    <text x="60" y="526">WebP, HEIC, mozjpeg</text><text x="300" y="526" font-family="Menlo, monospace">-q 1 … 100</text>
    <text x="60" y="586" fill="#64748b">Higher distance or quantizer means lower quality;</text>
    <text x="60" y="608" fill="#64748b">a higher -q means higher quality.</text>
  </g>

  <g>
    <text x="660" y="420" font-size="20" font-weight="700" fill="#0f172a">Search converges</text>
    <line x1="660" y1="434" x2="1140" y2="434" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="700" y1="620" x2="1120" y2="620" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="700" y1="620" x2="700" y2="455" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="700" y1="520" x2="1120" y2="520" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1120" y="512" font-size="13" text-anchor="end" fill="#c2410c">target 90</text>
    <polyline points="740,600 800,470 860,560 920,505 980,528 1040,518 1100,521" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <g fill="#7c3aed">
      <circle cx="740" cy="600" r="5"/><circle cx="800" cy="470" r="5"/><circle cx="860" cy="560" r="5"/>
      <circle cx="920" cy="505" r="5"/><circle cx="980" cy="528" r="5"/><circle cx="1040" cy="518" r="5"/>
      <circle cx="1100" cy="521" r="5"/>
    </g>
    <text x="910" y="645" font-size="13" text-anchor="middle" fill="#64748b">iteration</text>
    <text x="688" y="540" font-size="13" text-anchor="end" fill="#64748b" transform="rotate(-90 688 540)">ssimulacra2</text>
  </g>
</svg>
