# Keeps the GitHub Actions and the Docker base image current. Each update arrives as
# a pull request, where CI and, for the Dockerfile, the size-regression gate run.
# Tools pinned to a commit or version through Dockerfile ARGs (jpegli, flip,
# butteraugli, the Rust toolchain and crates) are outside Dependabot's reach and are
# bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
