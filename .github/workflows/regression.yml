name: Size regression gate

# Fails when a codec's bytes-at-equal-quality grow beyond tolerance, or its achieved
# ssimulacra2 score drops beyond tolerance, versus the committed baseline
# (compare/demos/baseline.json). Both are deterministic given the pinned codec
# versions in the image; timing is never checked. On pull requests it
# also uploads the HTML report and posts a sticky comment linking it. Runs on the
# PRs that can change codec output (Dockerfile, comparison sources, the baseline),
# plus main and on demand. Regenerate the baseline after a deliberate change with:
#   (download results.csv from this workflow's artifact; CI runs on amd64)
#   node compare/bin/check-regression.js compare/demos/baseline.json results.csv --update --target 90
on:
  pull_request:
    paths:
      - "Dockerfile"
      - "compare/src/**"
      - "compare/bin/**"
      - "compare/demos/baseline.json"
      - ".github/workflows/regression.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  # The comparison and the check share one target; the checker also fails if it
  # differs from the target the baseline was generated at.
  TARGET: "90"

jobs:
  regression:
    name: Check for size regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: image-tools:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fetch demo images
        run: bash compare/demos/fetch.sh

      - name: Compare and generate the report
        run: |
          # One run writes both the CSV the check reads and the HTML report.
          docker run --rm -v "$PWD:/work" -w /work --entrypoint bash image-tools:ci -c \
            "compare-codecs compare/demos/images --target $TARGET --csv results.csv --html report.html"

      - name: Check for size regressions
        id: check
        run: |
          STATUS=0
          docker run --rm -v "$PWD:/work" -w /work --entrypoint bash image-tools:ci -c \
            "node compare/bin/check-regression.js compare/demos/baseline.json results.csv --target $TARGET --tolerance 0.02 --quality-tolerance 0.5" \
            > regression.txt 2>&1 || STATUS=$?
          cat regression.txt
          {
            echo "## Size and quality regression check"
            echo ""
            echo '```'
            cat regression.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" -eq 0 ] && echo "failed=false" >> "$GITHUB_OUTPUT" || echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: Upload report and CSV
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codec-comparison
          path: |
            report.html
            results.csv

      - name: Comment the report link on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          FAILED: ${{ steps.check.outputs.failed }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        with:
          script: |
            const fs = require('fs');
            const failed = process.env.FAILED === 'true';
            const url = process.env.ARTIFACT_URL;
            const { owner, repo } = context.repo;
            // Artifacts expire (the repository's retention setting), after which the
            // link stops working; read the real date so the comment can say so. The
            // comment still goes out without it if the lookup fails.
            let availability = '';
            try {
              const { data: artifact } = await github.rest.actions.getArtifact({
                owner, repo, artifact_id: Number(process.env.ARTIFACT_ID),
              });
              availability = ' Available until ' + artifact.expires_at.slice(0, 10) + ', when GitHub deletes the artifact.';
            } catch (err) {
              core.warning('Could not read the artifact expiry: ' + err.message);
            }
            let table = '';
            try { table = fs.readFileSync('regression.txt', 'utf8').trim(); } catch {}
            const marker = '<!-- codec-comparison-report -->';
            const body = [
              marker,
              '### Codec comparison ' + (failed ? '❌ regression' : '✅ no size or quality regression'),
              '',
              '📥 **[Download the codec report](' + url + ')** (unzip and open `report.html` locally).' + availability,
              '',
              '<details><summary>Size check</summary>',
              '',
              '```',
              table,
              '```',
              '</details>',
            ].join('\n');
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on regression
        if: always()
        run: |
          if [ "${{ steps.check.outputs.failed }}" = "true" ]; then
            echo "Size or quality regression detected; see the job summary and PR comment."
            exit 1
          fi
